
<!DOCTYPE html>
<html>
<head>
    <title>Gallery Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            background: #101827;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            width: 280px;
        }

        input {
            padding: 12px;
            width: 90%;
            margin: 15px 0;
        }

        button {
            padding: 12px;
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #msg {
            color: red;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>PHOTO GALLERY</h2>
    <p>Enter Password</p>

    <input type="password" id="password"
    placeholder="Enter Password">

    <button onclick="checkPassword()">LOGIN</button>

    <p id="msg"></p>

</div>

<script>

function checkPassword() {

    var pass = document.getElementById("password").value;

    if(pass === "Satyam") {

        sessionStorage.setItem("galleryLogin", "yes");

        window.location.href = "index.html";

    } else {

        document.getElementById("msg").innerHTML =
        "Incorrect Password!";
    }
}

</script>

</body>
</html>
